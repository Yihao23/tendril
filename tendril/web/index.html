<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tendril</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1d1d1b; --muted: #6b6b66; --line: #e3e2de;
    --accent: #2f7d4f; --accent-soft: #e4f1e8; --warn: #a15c00; --warn-soft: #fbefdc; --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1e1f1c; --text: #e8e8e3; --muted: #9a9a93; --line: #33342f;
      --accent: #6cc28f; --accent-soft: #1f3327; --warn: #f0b060; --warn-soft: #3a2d18; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px 20px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  textarea, input, select { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
  textarea { resize: vertical; min-height: 70px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(0.96); }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .goal { padding: 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .goal:hover { background: var(--bg); }
  .goal.sel { border-color: var(--accent); background: var(--accent-soft); }
  .goal .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .goal .sub { color: var(--muted); font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); }
  .badge.running { color: var(--accent); border-color: var(--accent); }
  .badge.paused, .badge.warn { color: var(--warn); border-color: var(--warn); }
  .approval { background: var(--warn-soft); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .approval code { display: block; white-space: pre-wrap; word-break: break-all; font-size: 12px; margin: 6px 0; }
  .note { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .note:last-child { border: 0; }
  .muted { color: var(--muted); }
  .log { max-height: 60vh; overflow-y: auto; font-size: 13px; }
  .ev { padding: 6px 0; border-bottom: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
  .ev .k { font-size: 11px; color: var(--muted); margin-right: 6px; }
  .ev.user { color: var(--accent); }
  .ev.run { color: var(--muted); font-size: 12px; }
  .ev.tool_call, .ev.tool_result { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .ev.error { color: var(--err); }
  .ev.approval { color: var(--warn); }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1><img src="/logo.svg" alt="" width="24" height="24">Tendril</h1>
  <span class="meta" id="status"></span>
</header>
<main>
  <div>
    <section>
      <h2>New goal</h2>
      <textarea id="goalText" placeholder="e.g. Every morning, check Hacker News for posts about local LLMs and send me the 3 best."></textarea>
      <div class="row">
        <select id="every" style="width:auto">
          <option value="">Run once</option><option>30m</option><option>1h</option><option>6h</option><option>1d</option><option>1w</option>
        </select>
        <button class="primary" id="addBtn">Start</button>
      </div>
    </section>
    <section>
      <h2>Goals</h2>
      <div id="goals"></div>
    </section>
  </div>
  <div>
    <section id="approvalsBox" hidden>
      <h2>Waiting for your approval</h2>
      <div id="approvals"></div>
    </section>
    <section id="inboxBox" hidden>
      <h2>Inbox <button id="readBtn" style="float:right;font-size:12px;padding:2px 8px">Mark read</button></h2>
      <div id="inbox"></div>
    </section>
    <section>
      <h2 id="detailTitle">Activity</h2>
      <div id="detail"><div class="empty">Select a goal to see what it's doing.</div></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const when = (ts) => ts ? new Date(ts * 1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "–";
const every = (s) => !s ? "once" : [[604800,"w"],[86400,"d"],[3600,"h"],[60,"m"]].map(([n,u]) => s % n === 0 ? `every ${s/n}${u}` : null).find(Boolean) || `every ${s}s`;
let selected = null;

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const data = await r.json().catch(() => null);
  if (!r.ok) { alert(data?.detail || r.statusText); throw new Error(r.statusText); }
  return data;
}

async function refreshGoals() {
  const goals = await api("GET", "/api/goals");
  $("goals").innerHTML = goals.length ? goals.map((g) => `
    <div class="goal ${g.id === selected ? "sel" : ""}" data-id="${g.id}">
      <div class="text">#${g.id} ${esc(g.text)}</div>
      <div class="sub"><span class="badge ${g.status}">${g.status}</span>
        ${every(g.interval_s)} · next ${when(g.next_run_at)}
        ${g.pending_approvals ? `<span class="badge warn">${g.pending_approvals} to approve</span>` : ""}</div>
    </div>`).join("") : `<div class="empty">No goals yet.</div>`;
  document.querySelectorAll(".goal").forEach((el) => el.onclick = () => { selected = +el.dataset.id; refresh(); });
}

async function refreshApprovals() {
  const rows = await api("GET", "/api/approvals?status=pending");
  $("approvalsBox").hidden = !rows.length;
  $("approvals").innerHTML = rows.map((a) => `
    <div class="approval">
      <b>Goal #${a.goal_id}</b> wants to run <b>${esc(a.tool)}</b>
      <code>${esc(a.args)}</code>
      <button class="primary" data-ap="${a.id}" data-ok="1">Approve</button>
      <button data-ap="${a.id}" data-ok="0">Deny</button>
    </div>`).join("");
  document.querySelectorAll("[data-ap]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    await api("POST", `/api/approvals/${b.dataset.ap}`, {approve: b.dataset.ok === "1"});
    refresh();
  });
}

async function refreshInbox() {
  const rows = await api("GET", "/api/notifications?unread=true");
  $("inboxBox").hidden = !rows.length;
  $("inbox").innerHTML = rows.map((n) => `<div class="note"><span class="muted">${when(n.ts)} · #${n.goal_id ?? ""}</span><br>${esc(n.message)}</div>`).join("");
}

async function refreshDetail() {
  if (!selected) return;
  let data;
  try { data = await api("GET", `/api/goals/${selected}`); } catch { selected = null; return; }
  const g = data.goal;
  const log = $("log");
  const atBottom = !log || log.scrollHeight - log.scrollTop - log.clientHeight < 40;
  const draft = $("msg")?.value ?? "";
  $("detailTitle").textContent = `Goal #${g.id}`;
  $("detail").innerHTML = `
    <div style="white-space:pre-wrap;margin-bottom:8px">${esc(g.text)}</div>
    <div class="sub muted" style="margin-bottom:10px"><span class="badge ${g.status}">${g.status}</span>
      ${every(g.interval_s)} · ${g.run_count} wake-ups · workspace <code>${esc(data.workspace)}</code>
      ${g.last_error ? `<div style="color:var(--err)">last error: ${esc(g.last_error)}</div>` : ""}</div>
    <div class="row" style="margin:0 0 10px">
      <button id="runBtn">Run now</button>
      ${g.status === "paused" ? `<button id="resumeBtn">Resume</button>` : `<button id="pauseBtn">Pause</button>`}
      <button id="delBtn">Delete</button>
    </div>
    <div class="log" id="log">${data.events.map((e) =>
      `<div class="ev ${e.kind}"><span class="k">${when(e.ts)} ${e.kind}</span>${esc(e.content)}</div>`).join("") || `<div class="empty">Nothing yet.</div>`}</div>
    <div class="row"><input id="msg" placeholder="Message this goal (it will wake up)…"><button class="primary" id="sendBtn">Send</button></div>`;
  $("msg").value = draft;
  if (atBottom) $("log").scrollTop = $("log").scrollHeight;
  $("runBtn").onclick = () => api("POST", `/api/goals/${g.id}/run`).then(refresh);
  if ($("pauseBtn")) $("pauseBtn").onclick = () => api("POST", `/api/goals/${g.id}/pause`).then(refresh);
  if ($("resumeBtn")) $("resumeBtn").onclick = () => api("POST", `/api/goals/${g.id}/resume`).then(refresh);
  $("delBtn").onclick = () => confirm(`Delete goal #${g.id} and its history?`) &&
    api("DELETE", `/api/goals/${g.id}`).then(() => { selected = null; $("detail").innerHTML = ""; refresh(); });
  const send = () => { const t = $("msg").value.trim(); if (t) api("POST", `/api/goals/${g.id}/message`, {text: t}).then(() => { $("msg").value = ""; refresh(); }); };
  $("sendBtn").onclick = send;
  $("msg").onkeydown = (e) => { if (e.key === "Enter") send(); };
}

async function refresh() {
  await Promise.all([refreshGoals(), refreshApprovals(), refreshInbox(), refreshDetail()]);
}

$("addBtn").onclick = async () => {
  const text = $("goalText").value.trim();
  if (!text) return;
  const g = await api("POST", "/api/goals", {text, every: $("every").value || null});
  $("goalText").value = ""; selected = g.id; refresh();
};
$("readBtn").onclick = () => api("POST", "/api/notifications/read").then(refresh);
api("GET", "/api/status").then((s) => $("status").textContent = `model: ${s.model || "not set!"} · ${s.base_url || "api.openai.com"}`);
refresh();
setInterval(() => { if (document.activeElement?.id !== "msg" || !$("msg").value) refresh(); else Promise.all([refreshGoals(), refreshApprovals(), refreshInbox()]); }, 3000);
</script>
</body>
</html>
