[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tendril"
version = "0.1.0"
description = "An open-source, self-hosted, always-on AI agent that keeps working on your goals in the background."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
browser = ["playwright>=1.44"]
dev = ["pytest>=8"]
all = ["mcp>=1.2", "playwright>=1.44"]

[project.scripts]
tendril = "tendril.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
